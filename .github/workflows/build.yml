name: Build Validation

# To enable automatic builds later, add push: and pull_request: under on:.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure_preset: windows-ci
            build_preset: windows-ci
          - os: ubuntu-latest
            configure_preset: release
            build_preset: release
          - os: macos-latest
            configure_preset: release
            build_preset: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Provision and verify Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build libx11-dev libwayland-dev libwayland-bin wayland-protocols pkg-config libvulkan-dev libgl-dev libgtk-3-dev libcurl4-openssl-dev libjson-c-dev libssl-dev ca-certificates
          for tool in cc cmake ninja pkg-config wayland-scanner; do
            command -v "$tool" || { echo "::error::Required build tool missing: $tool"; exit 1; }
          done
          pkg-config --print-errors --exists vulkan gl x11 wayland-client wayland-protocols gtk+-3.0 libcurl json-c openssl
          protocols="$(pkg-config --variable=pkgdatadir wayland-protocols)"
          for protocol in stable/xdg-shell/xdg-shell.xml unstable/xdg-decoration/xdg-decoration-unstable-v1.xml; do
            test -f "$protocols/$protocol" || { echo "::error::Required Wayland protocol missing: $protocol"; exit 1; }
          done

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Windows build tools
        if: runner.os == 'Windows'
        run: |
          Get-Command cl.exe, link.exe, cmake, ninja -ErrorAction Stop

      - name: Provision Windows Launcher dependencies
        if: runner.os == 'Windows'
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'The runner must provide vcpkg.' }
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install curl:x64-windows json-c:x64-windows openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'Launcher dependency provisioning failed.' }
          foreach ($header in @('curl/curl.h', 'json-c/json.h', 'openssl/evp.h')) {
            if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/include/$header")) {
              throw "Missing Launcher dependency: $header"
            }
          }
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Provision Windows Vulkan headers and loader
        if: runner.os == 'Windows'
        uses: humbletim/setup-vulkan-sdk@c25f41106918cde0bf347e6f201277392b3a9e9d # v1.2.1
        env:
          CMAKE_GENERATOR: Ninja
        with:
          vulkan-query-version: '1.4.304.1'
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: false

      - name: Verify Windows Vulkan SDK
        if: runner.os == 'Windows'
        run: |
          if (-not $env:VULKAN_SDK) { throw 'Vulkan setup did not export VULKAN_SDK.' }
          # FindVulkan uses these directories beneath VULKAN_SDK automatically.
          foreach ($relative in @('include/vulkan/vulkan.h', 'lib/vulkan-1.lib')) {
            $path = Join-Path $env:VULKAN_SDK $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required Vulkan build dependency missing: $path"
            }
          }
          Write-Host "Vulkan SDK: $env:VULKAN_SDK"

      - name: Provision macOS Launcher dependencies
        if: runner.os == 'macOS'
        run: |
          brew install json-c openssl@3
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          test -f "$(brew --prefix json-c)/include/json-c/json.h"
          test -f "$(brew --prefix openssl@3)/include/openssl/evp.h"
          test -f "$(xcrun --sdk macosx --show-sdk-path)/usr/include/curl/curl.h"

      - name: Verify macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          for tool in cc cmake ninja xcrun; do
            command -v "$tool" || { echo "::error::Required build tool missing: $tool"; exit 1; }
          done
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          for framework in AppKit Metal QuartzCore OpenGL; do
            test -d "$sdk/System/Library/Frameworks/$framework.framework" || {
              echo "::error::Required Apple framework missing: $framework ($sdk)"; exit 1;
            }
          done

      - name: Configure Release
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build all targets
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel
