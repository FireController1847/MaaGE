name: Build Validation

# To enable automatic builds later, add push: and pull_request: under on:.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure_preset: windows-ci
            build_preset: windows-ci
          - os: ubuntu-latest
            configure_preset: release
            build_preset: release
          - os: macos-latest
            configure_preset: release
            build_preset: release
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Provision and verify Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ninja-build zlib1g-dev libx11-dev libwayland-dev libwayland-bin wayland-protocols pkg-config libvulkan-dev libgl-dev libgtk-3-dev libcurl4-openssl-dev libjson-c-dev libssl-dev libzip-dev libpng-dev ca-certificates
          for tool in cc cmake ninja pkg-config wayland-scanner; do
            command -v "$tool" || { echo "::error::Required build tool missing: $tool"; exit 1; }
          done
          pkg-config --print-errors --exists zlib vulkan gl x11 wayland-client wayland-protocols gtk+-3.0 libcurl json-c openssl libzip libpng
          protocols="$(pkg-config --variable=pkgdatadir wayland-protocols)"
          for protocol in stable/xdg-shell/xdg-shell.xml unstable/xdg-decoration/xdg-decoration-unstable-v1.xml; do
            test -f "$protocols/$protocol" || { echo "::error::Required Wayland protocol missing: $protocol"; exit 1; }
          done

      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Windows build tools
        if: runner.os == 'Windows'
        run: |
          Get-Command cl.exe, link.exe, cmake, ninja -ErrorAction Stop

      - name: Initialize Windows dependency manager
        if: runner.os == 'Windows'
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'The runner must provide vcpkg.' }
          $toolchain = "$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $toolchain -PathType Leaf)) {
            throw "Missing vcpkg toolchain: $toolchain"
          }
          # CMake installs the pinned manifest's enabled features before find_package.
          "CMAKE_TOOLCHAIN_FILE=$toolchain" >> $env:GITHUB_ENV

      - name: Provision macOS application dependencies
        if: runner.os == 'macOS'
        run: |
          brew install json-c openssl@3 libzip libpng
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"
          test -f "$(brew --prefix json-c)/include/json-c/json.h"
          test -f "$(brew --prefix openssl@3)/include/openssl/evp.h"
          test -f "$(brew --prefix libzip)/include/zip.h"
          test -f "$(brew --prefix libpng)/include/png.h"
          test -f "$(xcrun --sdk macosx --show-sdk-path)/usr/include/curl/curl.h"
          test -f "$(xcrun --sdk macosx --show-sdk-path)/usr/include/zlib.h"

      - name: Verify macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          for tool in cc cmake ninja xcrun; do
            command -v "$tool" || { echo "::error::Required build tool missing: $tool"; exit 1; }
          done
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          for framework in AppKit Metal QuartzCore OpenGL; do
            test -d "$sdk/System/Library/Frameworks/$framework.framework" || {
              echo "::error::Required Apple framework missing: $framework ($sdk)"; exit 1;
            }
          done

      - name: Configure Release
        run: cmake --preset ${{ matrix.configure_preset }}

      - name: Build all targets
        run: cmake --build --preset ${{ matrix.build_preset }} --parallel
